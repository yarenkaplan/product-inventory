services:
  app:
    build: . #meaning current directory
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/productInventory
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: productInventory
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}